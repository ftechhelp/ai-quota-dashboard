name: ai-quota-dashboard

services:
  dashboard:
    image: ${DASHBOARD_IMAGE:?DASHBOARD_IMAGE is required}
    build:
      context: ..
    container_name: ai-quota-dashboard
    env_file:
      - path: /HDD/development/ai-quota-dashboard/.env
        required: false
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /HDD/docker-data/apps/ai-quota-dashboard/dashboard/data:/data
    networks:
      - private
      - app-local
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4); assert response.status == 200"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  private:
    external: true
    name: private
  app-local:
    external: true
    name: ai-quota-dashboard-local
