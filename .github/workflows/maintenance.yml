name: Production maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to plan or run
        type: choice
        options: [inspect, status, reconcile, recreate, rollback, recover, accept]
        default: inspect
      plan_only:
        description: Only generate a reviewable plan
        type: boolean
        default: true
      approvals:
        description: Explicit approved categories, separated by commas
        type: string
        default: ''
      target:
        description: Saved release ID for rollback
        type: string
        default: ''
      plan_id:
        description: Exact reviewed plan ID to apply; blank creates a fresh plan
        type: string
        default: ''

permissions:
  contents: read

jobs:
  maintain:
    uses: ftechhelp/server-deploy-actions/.github/workflows/deploy.yml@584eb5e05987696637dbfd3abef6e9281fe4c95a
    with:
      app: ai-quota-dashboard
      operation: ${{ inputs.operation }}
      plan-only: ${{ inputs.plan_only }}
      approvals: ${{ inputs.approvals }}
      target: ${{ inputs.target }}
      plan-id: ${{ inputs.plan_id }}
