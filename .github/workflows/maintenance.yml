name: Production maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to plan or run
        type: choice
        options: [inspect, status, reconcile, recreate, rollback, recover, accept]
        default: inspect
      plan_only:
        description: Only generate a reviewable plan
        type: boolean
        default: true
      approvals:
        description: Explicit approved categories, separated by commas
        type: string
        default: ''
      target:
        description: Saved release ID for rollback
        type: string
        default: ''

permissions:
  contents: read

jobs:
  maintain:
    uses: ftechhelp/server-deploy-actions/.github/workflows/deploy.yml@d9bc52ad9d96d06f238722b35fe19a5ba43086f3
    with:
      app: ai-quota-dashboard
      operation: ${{ inputs.operation }}
      plan-only: ${{ inputs.plan_only }}
      approvals: ${{ inputs.approvals }}
      target: ${{ inputs.target }}
