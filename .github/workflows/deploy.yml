name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-quota-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, ai-quota-dashboard]
    timeout-minutes: 20
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Skip outdated runs
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest=$(git ls-remote https://github.com/ftechhelp/ai-quota-dashboard.git refs/heads/main | cut -f1)
          if [ "$latest" != "$EXPECTED_SHA" ]; then
            echo "The main branch has moved; refusing to deploy an older commit."
            exit 1
          fi
      - name: Validate Python
        run: python3 -m compileall -q .
      - name: Build and deploy
        run: bash deploy/deploy.sh
