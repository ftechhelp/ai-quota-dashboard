services:
  dashboard:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - chatgpt_data:/data
    networks:
      - private
    restart: no
    container_name: ai-quota-dashboard-dev
volumes:
  chatgpt_data:
networks:
  private:
    external: true
    name: private
name: ai-quota-dashboard-dev
